[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "afxdl"
description = "Download audio from aphextwin.warp.net"
readme = "README.md"
keywords = [
  "aphex-twin",
  "aphextwin",
  "audio",
  "cli",
  "commandline-tool",
  "downloader",
  "id3",
  "id3-tag",
  "mp3",
  "music",
  "warp",
  "warp-records",
]
license = "MIT"
authors = [ { name = "eggplants", email = "w10776e8w@yahoo.co.jp" } ]
requires-python = ">=3.12,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "mutagen>=1.47,<2",
  "pydantic>=2.10.5,<3",
  "requests>=2.32.3,<3",
  "wafsolver>=0.0.1",
]
urls.Documentation = "https://egpl.dev/afxdl/"
urls.Issues = "https://github.com/eggplants/afxdl/issues"
urls.Repository = "https://github.com/eggplants/afxdl"
scripts.afxdl = "afxdl.cli:main"

[dependency-groups]
dev = [
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt-py>=0",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7",
]
docs = [
  "pdoc>=16",
]

[tool.hatch]
version.source = "uv-dynamic-versioning"
build.targets.wheel.include = [ "afxdl" ]
build.targets.sdist.include = [ "afxdl" ]

[tool.uv]
python-downloads = "never"
default-groups = [
  "dev",
  "docs",
]
exclude-newer = "P7D"
# Own package: no cooldown needed.
exclude-newer-package.pyproject-fmt-py = "P0D"
exclude-newer-package.wafsolver = "2026-08-10T00:00:00Z"
preview = true

[tool.ruff]
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "ALL",
]
lint.ignore = [
  "COM812",
  "CPY001", # Missing copyright notice (this project does not use file headers)
  "D211",   # No blank lines allowed before class docstring
  "D213",   # Multi-line docstring summary should start at the second line
]
lint.per-file-ignores."afxdl/cli.py" = [
  "T201", # `print` found
]
lint.per-file-ignores."parse.py" = [
  "S101", # Use of assert detected
]
lint.per-file-ignores."tests/*.py" = [
  "D",
  "S101", # Use of assert detected
]
lint.pydocstyle.convention = "google"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
fallback-version = "0.0.0"
